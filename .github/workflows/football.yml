name: football-bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        working-directory: football
        run: pip install -r football/requirements.txt || pip install python-telegram-bot requests python-dotenv
      - name: Run
        working-directory: football
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py

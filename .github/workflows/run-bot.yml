name: Football Bot Test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
            - name: Install deps
        run: pip install -r football/requirements.txt
            - name: Check syntax
        run: python -m py_compile football/main.py && echo "OK - Reorg SUCCESS"
